{% extends "base.html" %}
{% block title %}Edit Item - {{ item.title }}{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm p-4">
                <h3 class="fw-bold mb-3">Edit Item Report</h3>
                <form action="/items/{{ item.id }}/edit" method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Item Title / Name</label>
                            <input type="text" name="title" class="form-control" value="{{ item.title }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Color</label>
                            <input type="text" name="color" class="form-control" value="{{ item.color }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Brand / Make</label>
                            <input type="text" name="brand" class="form-control" value="{{ item.brand }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Campus Location</label>
                            <select name="location_select" id="location_select" class="form-select" required>
                                {% for loc in locations %}
                                    <option value="{{ loc }}" {% if item.location == loc %}selected{% endif %}>{{ loc }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6" id="custom_location_group" style="display: none;">
                            <label class="form-label">Custom Location</label>
                            <input type="text" name="location_custom" id="location_custom" class="form-control" value="{{ item.location }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date Lost / Found</label>
                            <input type="date" name="date" class="form-control" value="{{ item.dateLostFound }}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Update Image (optional)</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Detailed Description</label>
                            <textarea name="description" class="form-control" rows="4" required>{{ item.description }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="/items/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
