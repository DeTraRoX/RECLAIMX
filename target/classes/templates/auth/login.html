{% extends "base.html" %}
{% block title %}Login - RECLAIMX{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg p-4">
                <div class="text-center mb-4">
                    <span class="brand-reclaim fs-2">RECLAIM</span><span class="brand-x fs-2">X</span>
                    <h4 class="fw-bold mt-2">Welcome Back</h4>
                    <p class="text-muted small">Sign in to manage your reported items and claims</p>
                </div>
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">College Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="student@reclaimx.com" value="{{ email }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                    </button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted small">Don't have an account?</span>
                    <a href="/register" class="fw-bold text-decoration-none ms-1">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
