{% extends "base.html" %}
{% block title %}Register - RECLAIMX{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg p-4">
                <div class="text-center mb-4">
                    <span class="brand-reclaim fs-2">RECLAIM</span><span class="brand-x fs-2">X</span>
                    <h4 class="fw-bold mt-2">Student Registration</h4>
                    <p class="text-muted small">Create an account to report items and file claims</p>
                </div>
                <form action="/register" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Ayush Sharma" value="{{ name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Student ID</label>
                            <input type="text" name="student_id" class="form-control" placeholder="STU101" value="{{ student_id }}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">College Email</label>
                            <input type="email" name="email" class="form-control" placeholder="ayush@reclaimx.com" value="{{ email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control" placeholder="Computer Science" value="{{ department }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Year of Study (1-5)</label>
                            <input type="number" name="year" class="form-control" min="1" max="5" placeholder="3" value="{{ year }}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 9876543210" value="{{ phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-4">
                        <i class="fa-solid fa-user-plus me-2"></i> Register Account
                    </button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="/login" class="fw-bold text-decoration-none ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
